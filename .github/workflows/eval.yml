name: GuardEval Synthetic Smoke Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ""
      POLICYMIND_URL: ""
      FLOWAGENT_URL: ""
      PYTHONPATH: "."

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CI-safe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.4 pydantic==2.13.4 httpx==0.28.1

      - name: Run synthetic smoke checks (NOT live quality evidence)
        run: |
          pytest -v
