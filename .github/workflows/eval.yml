name: GuardEval Regression Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ""
      POLICYMIND_URL: ""
      FLOWAGENT_URL: ""
      PYTHONPATH: "."

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CI-safe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.4 pydantic==2.13.4 httpx==0.28.1

      - name: Run offline regression tests
        run: |
          pytest -v
