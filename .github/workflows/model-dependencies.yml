name: Model Evaluation Dependency Preflight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model-evaluation dependencies and check consistency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Import the exact optional model-evaluation API contracts
        run: |
          python - <<'PY'
          from ragas import evaluate, EvaluationDataset
          from ragas.metrics import Faithfulness, ResponseRelevancy, LLMContextPrecisionWithReference
          from ragas.llms import LangchainLLMWrapper
          from ragas.embeddings import LangchainEmbeddingsWrapper
          from langchain_openai import ChatOpenAI, OpenAIEmbeddings
          from deepeval.test_case import LLMTestCase
          from deepeval.metrics import HallucinationMetric
          print('Model-evaluation imports verified; API credentials are not used in this check.')
          PY
