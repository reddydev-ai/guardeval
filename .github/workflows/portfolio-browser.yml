name: Portfolio Browser Visual QA
on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "scripts/check_portfolio_browser.cjs"
      - ".github/workflows/portfolio-browser.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/index.html"
      - "scripts/check_portfolio_browser.cjs"
      - ".github/workflows/portfolio-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright runner client
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Audit actual public page at desktop and mobile viewports
        run: node scripts/check_portfolio_browser.cjs
      - name: Save browser screenshots and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-qa
          path: visual-qa-artifacts/
          if-no-files-found: warn
          retention-days: 14

